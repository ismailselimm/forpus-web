name: Deploy to GitHub Pages

# main'e her push'ta siteyi build edip GitHub Pages'e yayınlar.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek deploy çalışsın; yeni push eskisini iptal etsin.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Build static site
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Yayın BİTTİKTEN sonra: "şu adresler değişti" bildirimi.
      # Bing ve Yandex protokolü destekliyor; Bing indeksi Copilot'un
      # yapay zekâ cevaplarını da besliyor. Google IndexNow kullanmıyor.
      # `continue-on-error`: bildirim başarısız olursa yayın yeşil kalmalı —
      # site zaten canlıda, bu yalnızca bir hızlandırıcı.
      - name: IndexNow bildirimi
        continue-on-error: true
        uses: actions/checkout@v4
      - name: IndexNow gönder
        continue-on-error: true
        run: |
          curl -sS --max-time 30 -X POST https://api.indexnow.org/IndexNow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$(node -e '
              const https=require("https");
              fetch("https://forpusyazilim.com/sitemap.xml").then(r=>r.text()).then(x=>{
                const u=[...x.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m=>m[1]);
                console.log(JSON.stringify({
                  host:"forpusyazilim.com",
                  key:"582a77f8b203e10e277985f95ae73b7b",
                  keyLocation:"https://forpusyazilim.com/582a77f8b203e10e277985f95ae73b7b.txt",
                  urlList:u
                }));
              });
            ')" -w "\n  IndexNow HTTP %{http_code}\n"
